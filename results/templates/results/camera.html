
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Facial Verification</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        input {
            padding: 12px;
            width: 80%;
            max-width: 350px;
            margin: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        video {
            width: 100%;
            max-width: 560px;
            background: black;
            border-radius: 10px;
        }

        button {
            padding: 12px 22px;
            margin: 12px 5px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #1769aa;
            color: white;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #status, #result {
            margin-top: 15px;
            font-weight: bold;
        }

        /* Verification progress bar */
        .progress-container {
            background: #ddd;
            height: 14px;
            border-radius: 20px;
            overflow: hidden;
            margin: 15px 0 8px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #16834a;
            border-radius: 20px;
            transition: width 0.25s ease;
        }

        .progress-text {
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            color: #444;
        }

        .match-text {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-top: 6px;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Student Facial Verification</h2>

    <p>Enter your matric number before starting verification.</p>

    <input
        type="text"
        id="matricNumber"
        placeholder="Enter matric number"
        autocomplete="off"
    >

    <br>

    <video id="video" autoplay playsinline></video>

    <canvas id="canvas" hidden></canvas>

    <form id="captureForm">
        {% csrf_token %}
    </form>

    <br>

    <button id="startBtn">Start Camera</button>
    <button id="stopBtn">Stop Camera</button>
    <button id="captureBtn" disabled>Start Verification</button>

    <p id="status">Camera not started.</p>

    <!-- Verification progress -->
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="progress-text" id="progressText">
        0 / 8 frames processed
    </div>

    <div class="match-text" id="matchText">
        Matching frames: 0 / 8
    </div>

    <p id="result"></p>

</div>

<script>

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");

    const status = document.getElementById("status");
    const result = document.getElementById("result");

    const matricInput = document.getElementById("matricNumber");

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const captureBtn = document.getElementById("captureBtn");

    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    const matchText = document.getElementById("matchText");

    const TOTAL_FRAMES = 8;

    let cameraStream = null;
    let verifying = false;

    // UPDATE PROGRESS BAR
    function updateProgress(progress, matches) {

        progress = Math.max(
            0,
            Math.min(Number(progress) || 0, TOTAL_FRAMES)
        );

        matches = Math.max(
            0,
            Math.min(Number(matches) || 0, TOTAL_FRAMES)
        );

        const percentage = (progress / TOTAL_FRAMES) * 100;

        progressBar.style.width = percentage + "%";

        progressText.textContent =
            `${progress} / ${TOTAL_FRAMES} frames processed`;

        matchText.textContent =
            `Matching frames: ${matches} / ${TOTAL_FRAMES}`;
    }


    // RESET PROGRESS
    function resetProgress() {

        progressBar.style.width = "0%";

        progressText.textContent =
            `0 / ${TOTAL_FRAMES} frames processed`;

        matchText.textContent =
            `Matching frames: 0 / ${TOTAL_FRAMES}`;
    }


    // START CAMERA
    startBtn.onclick = async function () {

        if (cameraStream) {
            return;
        }

        try {

            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: {
                    width: { ideal: 480 },
                    height: { ideal: 360 }
                },
                audio: false
            });

            video.srcObject = cameraStream;

            await video.play();

            status.textContent = "Camera started successfully.";
            result.textContent = "";

            resetProgress();

            captureBtn.disabled = false;
            startBtn.disabled = true;

        } catch (error) {

            cameraStream = null;
            status.textContent = "Camera error: " + error.message;

        }
    };


    // STOP CAMERA
    stopBtn.onclick = function () {

        verifying = false;

        if (cameraStream) {

            cameraStream.getTracks().forEach(track => track.stop());

            video.srcObject = null;
            cameraStream = null;

        }

        captureBtn.disabled = true;
        startBtn.disabled = false;
        captureBtn.textContent = "Start Verification";
        matricInput.disabled = false;

        status.textContent = "Camera stopped.";
    };


    // START / STOP VERIFICATION
    captureBtn.onclick = async function () {

        if (verifying) {
            verifying = false;
            captureBtn.textContent = "Start Verification";
            result.textContent = "Verification stopped.";
            matricInput.disabled = false;
            return;
        }

        const matricNumber = matricInput.value.trim();

        if (!matricNumber) {
            result.textContent = "Enter your matric number first.";
            return;
        }

        if (!cameraStream) {
            result.textContent = "Start the camera first.";
            return;
        }

        verifying = true;

        resetProgress();

        captureBtn.textContent = "Stop Verification";
        matricInput.disabled = true;

        result.textContent = "Verification started...";

        const context = canvas.getContext("2d");

        while (verifying) {

            if (!cameraStream || video.readyState < 2) {
                await new Promise(resolve => setTimeout(resolve, 100));
                continue;
            }

            // Capture frame at the camera's actual resolution
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            context.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );

            // Compress JPEG before upload
            const blob = await new Promise(resolve => {
                canvas.toBlob(resolve, "image/jpeg", 0.85);
            });

            if (!verifying) {
                break;
            }

            if (!blob) {
                result.textContent = "Frame capture failed.";
                verifying = false;
                break;
            }

            const formData = new FormData();

            formData.append("frame", blob, "frame.jpg");
            formData.append("matric_number", matricNumber);

            const csrfToken = document.querySelector(
                '[name=csrfmiddlewaretoken]'
            ).value;

            try {

                const response = await fetch("{% url 'receive_frame' %}", {
                    method: "POST",
                    headers: {
                        "X-CSRFToken": csrfToken
                    },
                    body: formData
                });

                const data = await response.json();
                console.log("VERIFICATION SERVER RESPONSE:", data);

                if (!verifying) {
                    break;
                }

                result.textContent = data.message;

                if (!response.ok) {
                    verifying = false;
                    break;
                }

                // Update visual progress
                updateProgress(
                    data.progress,
                    data.matches
                );

                if (data.verified) {

                    verifying = false;

                    // Complete the progress bar
                    updateProgress(TOTAL_FRAMES, TOTAL_FRAMES);

                    status.textContent =
                        "Identity successfully verified!";

                    result.textContent = "IDENTITY VERIFIED";

                    // Stop camera before redirecting
                    if (cameraStream) {
                        cameraStream.getTracks().forEach(track => track.stop());
                        cameraStream = null;
                    }

                    captureBtn.disabled = true;
                    startBtn.disabled = true;

                    result.textContent =
                        "Identity verified. Redirecting to your results...";

                    setTimeout(() => {
                        window.location.href = "{% url 'student_results' %}";
                    }, 700);

                    break;
                }

                // Short pause between frame submissions
                await new Promise(resolve => setTimeout(resolve, 250));

            } catch (error) {

                result.textContent =
                    "Upload failed: " + error.message;

                verifying = false;

            }
        }

        if (verifying === false && cameraStream) {
            captureBtn.textContent = "Start Verification";
            captureBtn.disabled = false;
            matricInput.disabled = false;
        }

    };

</script>

</body>
</html>
